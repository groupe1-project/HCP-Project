services:
  db:
    image: postgres:16-alpine
    container_name: hcp_db
    environment:
      POSTGRES_DB: hcp_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hcp_db"]
      interval: 10s
      timeout: 5s
      retries: 8

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: hcp_backend
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: "docker-dev-secret-key-change-me"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      POSTGRES_DB: "hcp_db"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"
      DJANGO_CORS_ALLOWED_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080"
      DJANGO_CSRF_TRUSTED_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080"
      DJANGO_AUTH_TOKEN_COOKIE_SECURE: "false"
      DJANGO_SESSION_COOKIE_SAMESITE: "Lax"
      DJANGO_CSRF_COOKIE_SAMESITE: "Lax"
      DJANGO_CORS_ALLOW_CREDENTIALS: "true"
      DJANGO_CSP_ENABLED: "false"
      DJANGO_EMAIL_BACKEND: "django.core.mail.backends.console.EmailBackend"
      OLLAMA_ENABLED: "true"
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_MODEL: "qwen2.5:7b-instruct"
      ASSISTANT_PREFER_OLLAMA: "true"
      ASSISTANT_ALLOW_GEMINI_FALLBACK: "false"
      ASSISTANT_OLLAMA_MODEL: "qwen2.5:7b-instruct"
    expose:
      - "8000"

  ollama:
    image: ollama/ollama:latest
    container_name: hcp_ollama
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: hcp_frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"

volumes:
  pg_data:
  ollama_data:
