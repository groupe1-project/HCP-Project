name: Deploy Staging

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy To Staging Server
    runs-on: ubuntu-latest
    environment: staging
    env:
      DEPLOYMENT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
        run: |
          missing=0
          for v in STAGING_HOST STAGING_USER STAGING_SSH_KEY STAGING_PATH; do
            if [ -z "${!v}" ]; then
              echo "Missing secret: $v"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Deployment aborted: configure staging secrets first."
            exit 1
          fi

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.STAGING_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync repository to staging
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.venv' \
            --exclude 'venv' \
            --exclude 'node_modules' \
            ./ "${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:${{ secrets.STAGING_PATH }}/"

      - name: Run remote deploy commands
        run: |
          ssh "${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}" "
            set -e
            cd '${{ secrets.STAGING_PATH }}'
            python3 -m pip install -r requirements.txt
            python3 manage.py migrate --noinput
            cd frontend
            npm ci
            npm run build
            cd ..
            python3 manage.py check
            echo 'Staging deployment completed.'
          "

      - name: Notify staging deployment success
        if: success() && secrets.STAGING_NOTIFY_WEBHOOK != ''
        run: |
          payload=$(printf '{"text":"[HCP] Staging deployment succeeded. Workflow: %s"}' "$DEPLOYMENT_URL")
          curl -sS -X POST -H "Content-Type: application/json" --data "$payload" "${{ secrets.STAGING_NOTIFY_WEBHOOK }}"

      - name: Notify staging deployment failure
        if: failure() && secrets.STAGING_NOTIFY_WEBHOOK != ''
        run: |
          payload=$(printf '{"text":"[HCP] Staging deployment failed. Workflow: %s"}' "$DEPLOYMENT_URL")
          curl -sS -X POST -H "Content-Type: application/json" --data "$payload" "${{ secrets.STAGING_NOTIFY_WEBHOOK }}"
