name: Delivery Package (No Server)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to package (branch, tag, or commit SHA)
        required: false
        default: main

jobs:
  package:
    name: Build and Package Delivery Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'main' }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Backend safety checks
        env:
          DJANGO_SECRET_KEY: ci-secret-key
          DJANGO_DEBUG: "false"
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
          POSTGRES_DB: hcp_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
        run: |
          python manage.py check

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build delivery bundle
        run: |
          mkdir -p dist_delivery
          rsync -az \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.venv' \
            --exclude 'venv' \
            --exclude 'node_modules' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude 'db.sqlite3' \
            ./ dist_delivery/app/

          tar -czf dist_delivery/hcp_delivery_${{ github.sha }}.tgz -C dist_delivery app
          sha256sum dist_delivery/hcp_delivery_${{ github.sha }}.tgz > dist_delivery/hcp_delivery_${{ github.sha }}.sha256

      - name: Upload delivery artifact
        uses: actions/upload-artifact@v4
        with:
          name: hcp-delivery-${{ github.sha }}
          path: |
            dist_delivery/hcp_delivery_${{ github.sha }}.tgz
            dist_delivery/hcp_delivery_${{ github.sha }}.sha256
          if-no-files-found: error
