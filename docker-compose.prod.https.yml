services:
  backend:
    environment:
      DJANGO_SECURE_SSL_REDIRECT: "true"
      DJANGO_SESSION_COOKIE_SECURE: "true"
      DJANGO_CSRF_COOKIE_SECURE: "true"
      DJANGO_AUTH_TOKEN_COOKIE_SECURE: "true"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.https
    ports:
      - "${FRONTEND_HTTPS_BIND_ADDRESS:-0.0.0.0}:${FRONTEND_HTTPS_PORT:-8443}:443"
    volumes:
      - ./docker/nginx/certs:/etc/nginx/certs:ro